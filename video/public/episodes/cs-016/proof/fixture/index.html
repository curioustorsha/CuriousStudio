<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a table</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Book a table</h1>
    <form id="booking">
      <label class="field">
        <span>Name</span>
        <input class="input" name="name" type="text" required>
      </label>
      <label class="field">
        <span>Email</span>
        <input class="input" name="email" type="email" required>
      </label>
      <label class="field">
        <span>Guests</span>
        <input class="input" name="guests" type="number" min="1" max="12" value="2" required>
      </label>
      <button class="button" type="submit">Book</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
